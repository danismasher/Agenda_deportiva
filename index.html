<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Mi agenda deportiva</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--card:#fff;--day:#fff;--tx:#14161a;--mu:#6b7280;--bd:#e2e4e8;--chip:#e9ebef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d23;--day:#23272f;--tx:#f2f3f5;--mu:#98a0ab;--bd:#2a2e36;--chip:#242830;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d23;--day:#23272f;--tx:#f2f3f5;--mu:#98a0ab;--bd:#2a2e36;--chip:#242830;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:"Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mu);font-size:15px;margin-top:2px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:12px 0 4px}
.chip{border:2px solid transparent;background:var(--chip);color:var(--tx);border-radius:999px;padding:7px 2px;font:inherit;font-size:15px;white-space:nowrap;text-align:center;font-weight:600;cursor:pointer}
.chip.on{background:var(--c);color:#fff}
.chip.off{opacity:.38;text-decoration:line-through}
.chip.on.dk,.badge.dk,.dots i.dk{color:#1b1d21}
[style*="--c:#ffffff"]{box-shadow:0 0 0 1px rgba(120,120,120,.5)}
*{-webkit-tap-highlight-color:transparent}
.chips,.chip,#shChips{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip{touch-action:manipulation;outline:none}
.chip:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.chip.ft{position:relative}
.chip.ft::after{content:"";position:absolute;top:4px;right:8px;width:9px;height:9px;border-radius:50%;background:#1b1d21;box-shadow:0 0 0 1.5px #fff}
#sheet,#rsheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden],#rsheet[hidden]{display:none}
#shBg,#rsBg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.shBox{position:relative;width:100%;max-width:560px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#shT,#rsT{display:block;font-size:22px;font-weight:700;margin-bottom:12px}
#shChips{display:flex;flex-wrap:wrap;gap:8px}
#shChips .chip{padding:10px 16px;font-size:16px}
.shAct{display:flex;gap:10px;margin-top:18px}
.shAct button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;background:var(--chip);color:var(--tx)}
.shAct #shOk,.shAct #rsOk{background:var(--tx);color:var(--bg)}
.shAct #shAll.on{background:var(--c);color:#fff}
.shAct #shAll.on.dk{color:#1b1d21}
.chip:focus-visible,.day:focus-visible,.hd:focus-visible,.nav:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.heads{display:flex;gap:18px;margin:8px 0 8px}
.hd{border:0;background:none;font:inherit;font-size:17px;font-weight:700;color:var(--mu);padding:0 0 3px;border-bottom:3px solid transparent;cursor:pointer}
.hd.on{color:var(--tx);border-bottom-color:var(--tx)}
.pager{display:flex;align-items:flex-start;overflow:hidden;touch-action:pan-y}
.pg{flex:0 0 100%;min-width:0;transform:translateX(calc(var(--p,0)*-100%));transition:transform .28s ease}
.pager:not(.mv)[data-p="0"] #list,.pager:not(.mv)[data-p="1"] #cal{height:0;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}
.mh b{font-size:19px;text-transform:capitalize}
.nav{border:0;background:var(--chip);color:var(--tx);width:30px;height:30px;border-radius:9px;font-size:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;color:var(--mu);font-size:14px;font-weight:600;padding:4px 0}
.day{aspect-ratio:1/1.55;min-height:0;overflow:hidden;border:0;border-radius:12px;background:var(--day);color:var(--tx);font:inherit;font-size:18px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;cursor:pointer}
.day.out{opacity:.35}
.day.today{box-shadow:inset 0 0 0 2px var(--tx)}
.day.sel{background:var(--tx);color:var(--bg)}
.dots{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 5px}
.dots.two{display:flex;flex-direction:row;gap:3px;padding:0 4px}
.dots.two .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dots i{display:flex;align-items:center;justify-content:center;flex:none;height:4px;border-radius:2px;background:var(--c);color:#fff;font-size:10px;font-weight:700;line-height:1;font-style:normal}
.dots i.n{height:11px;border-radius:6px}
.dh{font-size:21px;font-weight:700;margin:20px 0 10px;text-transform:capitalize}
.card{position:relative;display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:16px;margin-bottom:10px;border-left:10px solid var(--c)}
.time{font-size:32px;font-weight:700;line-height:1;min-width:76px;letter-spacing:-.02em}
.card.past{cursor:pointer}
.lv{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:14px;font-weight:700;color:#ff5a5a;vertical-align:middle}
.lv.fin{color:var(--mu)}
.lv .pt{width:8px;height:8px;border-radius:50%;background:#ff5a5a;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.card.cr .det{padding-right:64px}
.crests{position:absolute;right:16px;bottom:14px;display:flex;align-items:center;pointer-events:none}
.card.past .crests{right:42px}
.crests img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 0 1px rgba(255,255,255,.7))}
.crests img+img{margin-left:-16px}
.crests img:first-child{position:relative;z-index:2}
.chev{margin-left:auto;color:var(--mu);font-size:28px;line-height:1}
#rsheet .shBox{max-height:85vh;overflow:auto}
.rsub{color:var(--mu);font-size:15px;margin:-6px 0 12px}
.rhead{font-size:21px;font-weight:700;margin:6px 0 10px;line-height:1.2}
.rr{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:17px}
.rr i{font-style:normal;color:var(--mu);font-size:15px}
.nb{display:block;font-size:13px;font-weight:600;letter-spacing:0;color:var(--mu);margin-bottom:4px}
.body b{display:block;font-size:20px;line-height:1.15}
.badge{display:inline-block;margin-top:6px;font-size:14px;font-weight:700;color:#fff;background:var(--c);border-radius:8px;padding:2px 9px}
.det{color:var(--mu);font-size:15px;margin-top:4px}
.empty{color:var(--mu);text-align:center;padding:26px 10px;background:var(--card);border-radius:18px}
.note{color:var(--mu);font-size:13.5px;text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="chips" id="chips"></div>
<div class="heads"><button class="hd on" data-i="0">Calendario</button><button class="hd" data-i="1">Próximos</button></div>
<div class="pager" id="pager" data-p="0">
<section id="cal" class="pg">
  <div class="mh"><button class="nav" id="prev" aria-label="Mes anterior">‹</button><b id="mt"></b><button class="nav" id="next" aria-label="Mes siguiente">›</button></div>
  <div class="grid" id="grid"></div>
  <div id="dayList"></div>
</section>
<section id="list" class="pg"></section>
</div>
<p class="note" id="note"></p>
<div id="rsheet" hidden><div id="rsBg"></div><div class="shBox"><b id="rsT"></b><div id="rsB"></div><div class="shAct"><button id="rsOk">Cerrar</button></div></div></div>
<div id="sheet" hidden><div id="shBg"></div><div class="shBox"><b id="shT"></b><div id="shChips"></div><div class="shAct"><button id="shAll">Todos los equipos</button><button id="shOk">Listo</button></div></div></div>
<script>
const S={f1:["F1","#e10600","🏎️"],indy:["IndyCar","#ff4a5a","🏁"],motogp:["MotoGP","#e5239d","🏍️"],nfl:["NFL","#1e3a8a","🏈"],nhl:["NHL","#aab3bd","🏒"],tenis:["Tenis","#4d9a0b","🎾"],padel:["Pádel","#2563eb","🏓"],laliga:["LaLiga","#ff6f5e","⚽"],champions:["Champions","#ffffff","🏆"]};
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let ev=[];
const toEv=r=>{if(r.tbc||!r.start)return{date:r.date,time:"–:–",s:r.s,title:r.title,sub:r.res?(r.sub||""):(r.sub?r.sub+", ":"")+"hora por confirmar",res:r.res};const d=new Date(r.start);return{date:key(d),time:String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),s:r.s,title:r.title,sub:r.sub||"",nb:!!r.nb,ts:d.getTime(),res:r.res,ic:r.ic}};
function setData(j){ev=(j.events||[]).filter(r=>S[r.s]).map(toEv).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));ev.forEach((e,i)=>e.id=i);$("note").textContent=j.updated?"Datos actualizados el "+new Date(j.updated).toLocaleString("es-ES",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):""}
let lastLoad=0;
async function load(){lastLoad=Date.now();let j=null;try{const r=await fetch("events.json?"+Date.now(),{cache:"no-cache"});if(r.ok){j=await r.json();try{localStorage.setItem("agd",JSON.stringify(j))}catch(e){}}}catch(e){}
if(!j){try{j=JSON.parse(localStorage.getItem("agd")||"null")}catch(e){}}
if(j){setData(j);all();pollLive()}else $("note").textContent="No se han podido cargar los eventos."}
let only=null;let hidden=new Set();const DK=new Set(["laliga","champions","nhl"]);
const TM={laliga:[["Real Madrid","Real Madrid"],["FC Barcelona","Barcelona"],["Atlético de Madrid","Atlético"]],nfl:["Seahawks","Patriots","Cowboys","49ers","Bills","Bears"].map(x=>[x,x]),nhl:["Bruins","Kraken","Oilers","Maple Leafs","Golden Knights","Canadiens"].map(x=>[x,x])};
TM.champions=TM.laliga;
const tm={laliga:new Set(),champions:new Set(),nfl:new Set(),nhl:new Set()};
function saveF(){try{localStorage.setItem("agf",JSON.stringify({only,hidden:[...hidden],tm:Object.fromEntries(Object.entries(tm).map(([k,v])=>[k,[...v]]))}))}catch(e){}}
try{const f=JSON.parse(localStorage.getItem("agf")||"null");if(f){only=S[f.only]?f.only:null;hidden=new Set((f.hidden||[]).filter(k=>S[k]));for(const k in tm)((f.tm&&f.tm[k])||[]).forEach(w=>tm[k].add(w))}}catch(e){}
const today=key(new Date());
let sel=today,cur=new Date();cur.setDate(1);
const $=id=>document.getElementById(id);
const fmt=(k,o)=>new Date(k+"T12:00:00").toLocaleDateString("es-ES",o);
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const vis=()=>ev.filter(e=>!hidden.has(e.s)&&(!only||e.s===only)&&(!tm[e.s]||!tm[e.s].size||[...tm[e.s]].some(w=>norm(e.title).includes(norm(w)))));
const isPast=e=>e.ts?e.ts<Date.now():e.date<today;
// ---- resultados en directo (ESPN, leidos desde el movil mientras la app esta abierta) ----
const ESPN="https://site.api.espn.com/apis/site/v2/sports/";
const LIVE_PATH={laliga:"soccer/esp.1",champions:"soccer/uefa.champions",nfl:"football/nfl",nhl:"hockey/nhl",tenis:"tennis/atp"};
const LIVE_WIN={laliga:3.3,champions:3.3,nfl:4.6,nhl:3.7,tenis:8};
let live={};
const lk=e=>e.s+"|"+e.ts+"|"+e.title;
const ymd=ms=>new Date(ms).toISOString().slice(0,10).replace(/-/g,"");
const lw=s=>norm(s||"").replace(/[^a-z0-9 ]/g,"").trim().split(/\s+/).pop();
const vtx=v=>v&&typeof v==="object"?String(v.displayValue??v.value??""):(v==null?"":String(v));
function liveDetail(s,st){
  const ty=st.type||{};
  if(ty.name==="STATUS_HALFTIME")return "Descanso";
  if(s==="nfl")return "Q"+(st.period||"")+" "+(st.displayClock||"");
  if(s==="nhl"){const p=st.period||0;return (p<=3?"P"+p:p===4?"Prórroga":"Penaltis")+(p<=4?" "+(st.displayClock||""):"")}
  return st.displayClock||ty.shortDetail||"";
}
function parseGames(s,j){
  const out=[];
  const addT=c=>{const ps=c.competitors||[];if(ps.length!==2)return;
    const names=ps.map(p=>(p.athlete&&p.athlete.displayName)||(p.team&&p.team.displayName)||"");
    const ls=ps.map(p=>(p.linescores||[]).map(x=>vtx(x.value).replace(/\.0$/,"")));
    const st=c.status||{},ty=st.type||{};
    out.push({names,t:Date.parse(c.date||c.startDate||""),state:ty.state,ls,detail:ty.shortDetail||(ls[0].length?"Set "+ls[0].length:"")})};
  for(const ev of j.events||[]){
    if(s==="tenis"){(ev.groupings||[]).forEach(g=>(g.competitions||[]).forEach(addT));(ev.competitions||[]).forEach(addT);continue}
    const c=(ev.competitions||[])[0];if(!c)continue;
    const cs=c.competitors||[],hm=cs.find(x=>x.homeAway==="home"),aw=cs.find(x=>x.homeAway==="away");if(!hm||!aw)continue;
    const st=ev.status||c.status||{},ty=st.type||{};
    out.push({names:[hm.team.displayName,aw.team.displayName],t:Date.parse(ev.date),state:ty.state,sc:[vtx(hm.score),vtx(aw.score)],detail:liveDetail(s,st)});
  }
  return out;
}
function matchGame(e,games){
  const [a,b]=e.title.split(" – ");
  for(const g of games){
    if(!(Math.abs(g.t-e.ts)<12*36e5))continue;
    const fwd=lw(a)===lw(g.names[0])&&lw(b)===lw(g.names[1]);
    const rev=lw(a)===lw(g.names[1])&&lw(b)===lw(g.names[0]);
    if(fwd||rev)return {g,rev:!fwd};
  }
  return null;
}
async function pollLive(){
  if(document.hidden||!ev.length)return;
  const now=Date.now();
  const cand=ev.filter(e=>e.ts&&LIVE_PATH[e.s]&&!e.res&&e.ts<=now+10*60000&&now-e.ts<LIVE_WIN[e.s]*36e5);
  const sports=[...new Set(cand.map(e=>e.s))];
  if(!sports.length)return;
  let changed=false,fails=0;
  await Promise.all(sports.map(async s=>{
    try{
      const r=await fetch(`${ESPN}${LIVE_PATH[s]}/scoreboard?dates=${ymd(now-864e5)}-${ymd(now+864e5)}&limit=300`);
      if(!r.ok)throw 0;
      const games=parseGames(s,await r.json());
      cand.filter(e=>e.s===s).forEach(e=>{
        const m=matchGame(e,games);if(!m||(m.g.state!=="in"&&m.g.state!=="post"))return;
        let text;
        if(s==="tenis"){const w=m.rev?1:0;text=(m.g.ls[w]||[]).map((x,i)=>x+"-"+((m.g.ls[1-w]||[])[i]??"")).join(" ")||"–"}
        else text=m.rev?m.g.sc[1]+" – "+m.g.sc[0]:m.g.sc[0]+" – "+m.g.sc[1];
        const v={state:m.g.state,text,detail:m.g.state==="in"?m.g.detail:"Final"};
        const old=live[lk(e)];
        if(!old||old.text!==v.text||old.detail!==v.detail||old.state!==v.state){live[lk(e)]=v;changed=true}
      });
    }catch(_){fails++}
  }));
  if(fails===sports.length){$("note").textContent="Directo no disponible ahora (no se pudo conectar con la fuente)."}
  if(changed){cal();list()}
}
const liveTag=e=>{const L=!e.res&&live[lk(e)];return L?`<span class="lv${L.state==="in"?"":" fin"}">${L.state==="in"?'<i class="pt"></i>EN VIVO':"FINAL"}&nbsp;${L.text}${L.state==="in"&&L.detail?",&nbsp;"+L.detail:""}</span>`:""};
const small=u=>u.replace(/^https:\/\/a\.espncdn\.com(\/.*)$/,"https://a.espncdn.com/combiner/i?img=$1&w=96&h=96");
const crest=u=>`<img src="${small(u)}" data-o="${u}" alt="" loading="lazy" decoding="async" onerror="this.onerror=null;this.src=this.dataset.o">`;
const card=e=>`<div class="card${isPast(e)?" past":""}${e.ic?" cr":""}" data-i="${e.id}" style="--c:${S[e.s][1]}"><div class="time">${e.nb?'<small class="nb">No antes de</small>':""}${e.time}</div><div class="body"><b>${e.title}</b><span class="badge${DK.has(e.s)?" dk":""}">${S[e.s][0]}</span>${liveTag(e)}<div class="det">${e.sub}</div></div>${e.ic?`<div class="crests">${crest(e.ic[0])}${crest(e.ic[1])}</div>`:""}${isPast(e)?'<span class="chev">›</span>':""}</div>`;
function chips(){$("chips").innerHTML=Object.entries(S).map(([k,[n,c,i]])=>`<button class="chip ${hidden.has(k)?"off":(!only||only===k?"on":"")}${DK.has(k)?" dk":""}${tm[k]&&tm[k].size?" ft":""}" style="--c:${c}" data-k="${k}">${n}</button>`).join("")}
function cal(){
  $("mt").textContent=cur.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
  const y=cur.getFullYear(),m=cur.getMonth(),off=(new Date(y,m,1).getDay()+6)%7;
  let h=["L","M","X","J","V","S","D"].map(d=>`<div class="wd">${d}</div>`).join("");
  const all=vis();
  for(let i=0;i<42;i++){
    const d=new Date(y,m,1-off+i),k=key(d);
    if(i>=35&&d.getMonth()!==m)break;
    const cnt={};all.filter(e=>e.date===k).forEach(e=>cnt[e.s]=(cnt[e.s]||0)+1);
    const bars=Object.entries(cnt).map(([s,n])=>({n,h:`<i class="${n>1?"n":""}${DK.has(s)?" dk":""}" style="--c:${S[s][1]}">${n>1?n:""}</i>`}));
    let dots;
    if(bars.length>5){const cols=[[],[]],hs=[0,0];bars.forEach(b=>{const c=hs[0]<=hs[1]?0:1;cols[c].push(b.h);hs[c]+=(b.n>1?11:4)+2});dots=cols.map(c=>`<span class="col">${c.join("")}</span>`).join("")}
    else dots=bars.map(b=>b.h).join("");
    h+=`<button class="day ${d.getMonth()!==m?"out":""} ${k===today?"today":""} ${k===sel?"sel":""}" data-d="${k}"><span>${d.getDate()}</span><span class="dots${Object.keys(cnt).length>5?" two":""}">${dots}</span></button>`;
  }
  $("grid").innerHTML=h;
  const l=all.filter(e=>e.date===sel);
  $("dayList").innerHTML=`<div class="dh">${fmt(sel,{weekday:"long",day:"numeric",month:"long"})}</div>`+(l.length?l.map(card).join(""):`<div class="empty">No hay eventos este día con los filtros elegidos.</div>`);
}
function list(){
  const l=vis().filter(e=>e.date>=today);let last="",h="";
  for(const e of l){if(e.date!==last){last=e.date;h+=`<div class="dh">${e.date===today?"Hoy":fmt(e.date,{weekday:"long",day:"numeric",month:"long"})}</div>`}h+=card(e)}
  $("list").innerHTML=h||`<div class="empty">No hay próximos eventos con los filtros elegidos.</div>`;
}
function all(){chips();cal();list();saveF()}
let lp=false,lt=null,sk=null,so=0;
let lastTap={k:null,t:0,only:null,hidden:null};
$("chips").onclick=e=>{const k=e.target.closest("[data-k]")?.dataset.k;if(lp){lp=false;return}if(!k)return;
  const now=Date.now();
  if(lastTap.k===k&&now-lastTap.t<350){            // doble toque: ocultar o volver a mostrar ese deporte
    only=lastTap.only;hidden=new Set(lastTap.hidden);
    hidden.has(k)?hidden.delete(k):hidden.add(k);
    lastTap={k:null,t:0,only:null,hidden:null};all();return}
  lastTap={k,t:now,only,hidden:[...hidden]};
  hidden.delete(k);only=only===k?null:k;all()};
$("chips").addEventListener("pointerdown",e=>{lp=false;clearTimeout(lt);const k=e.target.closest("[data-k]")?.dataset.k;if(!k||!TM[k])return;lt=setTimeout(()=>{lp=true;openSheet(k)},450)});
["pointerup","pointercancel","pointerleave"].forEach(t=>$("chips").addEventListener(t,()=>clearTimeout(lt)));
$("chips").addEventListener("contextmenu",e=>e.preventDefault());
function openSheet(k){sk=k;only=k;hidden.delete(k);so=Date.now();all();shRender();$("sheet").hidden=false}
function shRender(){$("shT").textContent=S[sk][0]+": equipos";$("shChips").innerHTML=TM[sk].map(([n,w])=>`<button class="chip ${tm[sk].has(w)?"on":""}${DK.has(sk)?" dk":""}" style="--c:${S[sk][1]}" data-w="${w}">${n}</button>`).join("");const a=$("shAll");a.style.setProperty("--c",S[sk][1]);a.classList.toggle("on",!tm[sk].size);a.classList.toggle("dk",DK.has(sk));a.style.boxShadow=S[sk][1]==="#ffffff"&&!tm[sk].size?"0 0 0 1px rgba(120,120,120,.5)":""}
$("shChips").onclick=e=>{const w=e.target.closest("[data-w]")?.dataset.w;if(!w)return;tm[sk].has(w)?tm[sk].delete(w):tm[sk].add(w);shRender();all()};
$("shAll").onclick=()=>{tm[sk].clear();shRender();all()};
$("shOk").onclick=()=>{$("sheet").hidden=true};
$("shBg").onclick=()=>{if(Date.now()-so>400)$("sheet").hidden=true};
$("grid").onclick=e=>{const d=e.target.closest("[data-d]")?.dataset.d;if(!d)return;sel=d;cal()};
$("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);cal()};
$("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);cal()};
const pg=$("pager"),hds=document.querySelectorAll(".hd");let pi=0,tx=0,ty=0;
function go(i){if(i<0||i>1||i===pi)return;pi=i;pg.dataset.p=i;pg.style.setProperty("--p",i);pg.classList.add("mv");setTimeout(()=>pg.classList.remove("mv"),300);hds.forEach((h,j)=>h.classList.toggle("on",j===i))}
hds.forEach(h=>h.onclick=()=>go(+h.dataset.i));
pg.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
pg.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:0)});
function showRes(i){
  const e=ev[i];if(!e||!isPast(e))return;
  $("rsT").textContent=e.title;
  let b=`<div class="rsub">${S[e.s][0]}, ${fmt(e.date,{weekday:"short",day:"numeric",month:"short"})}${e.time[0]!=="–"?" "+e.time:""}${e.sub?", "+e.sub:""}</div>`;
  const L=!e.res&&live[lk(e)];
  if(L){b+=`<div class="rhead">${L.text} <small>${L.state==="in"?(L.detail||""):"Final"}</small></div><div class="empty">${L.state==="in"?"Resultado en directo, se actualiza solo.":"Resultado provisional, se confirma en unos minutos."}</div>`}
  else if(e.res){
    if(e.res.head)b+=`<div class="rhead">${e.res.head}</div>`;
    b+=(e.res.rows||[]).map(r=>`<div class="rr"><b>${r[0]}</b><span>${r[1]} <i>${r[2]||""}</i></span><i>${r[3]||""}</i></div>`).join("");
  }else b+=`<div class="empty">${e.s==="motogp"?"Los resultados de MotoGP no se cargan automáticamente.":"Todavía no hay resultado disponible para este evento."}</div>`;
  $("rsB").innerHTML=b;$("rsheet").hidden=false;
}
document.addEventListener("click",x=>{const c=x.target.closest(".card.past");if(c)showRes(+c.dataset.i)});
$("rsOk").onclick=()=>{$("rsheet").hidden=true};
$("rsBg").onclick=()=>{$("rsheet").hidden=true};
all();load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){pollLive();if(Date.now()-lastLoad>120000)load()}});
setInterval(pollLive,45000);
setInterval(()=>{if(!document.hidden)load()},300000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
